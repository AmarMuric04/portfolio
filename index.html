			rel="stylesheet"

		<title>Amar Muric | Portfolio</title>
		<script>
			{
				const storedIsLight = localStorage.getItem("isLight");
				const isLight =
					storedIsLight === null
						? !matchMedia("(prefers-color-scheme: dark)").matches
						: JSON.parse(storedIsLight);
				document.documentElement.dataset.theme = isLight
					? "light"
					: "dark";
			}
		</script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
